name: Build Unity Mono iOS ARM64 JIT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain
        run: |
          set -euxo pipefail

          echo "=== macOS ==="
          sw_vers

          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos -f clang
          xcrun --sdk iphoneos -f clang++
          xcrun --sdk iphoneos -f ld

      - name: Prepare local Mono build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"

          mkdir -p "$DEPS/autoconf-2-69"
          mkdir -p "$DEPS/automake-1-16-1"
          mkdir -p "$DEPS/libtool-2-4-6"
          mkdir -p "$DEPS/iOSBuildEnvironment/builds"

          echo "Downloading autoconf..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/autoconf/autoconf-2.69.tar.gz \
            -o "$DEPS/autoconf-2-69/autoconf-2.69.tar.gz"

          echo "Downloading automake..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/automake/automake-1.16.1.tar.gz \
            -o "$DEPS/automake-1-16-1/automake-1.16.1.tar.gz"

          echo "Downloading libtool..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/libtool/libtool-2.4.6.tar.gz \
            -o "$DEPS/libtool-2-4-6/libtool-2.4.6.tar.gz"

      - name: Provide Xcode compatibility layout
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"

          XCODE_SELECT="$(xcode-select -p)"
          XCODE_APP="$(dirname "$(dirname "$XCODE_SELECT")")"

          echo "Xcode app: $XCODE_APP"

          ln -sfn \
            "$XCODE_APP" \
            "$DEPS/iOSBuildEnvironment/builds/Xcode.app"

          test -x \
            "$DEPS/iOSBuildEnvironment/builds/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"

          echo "Compatibility Xcode path:"
          ls -la "$DEPS/iOSBuildEnvironment/builds"

      - name: Patch Unity iOS build configuration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("external/buildscripts/build.pl")
          text = path.read_text()

          start = text.index("\t\tif ($iphone)\n")
          end = text.index("\t\telsif ($iphoneSimulator)", start)

          block = text[start:end]

          # Use the SDK installed on the GitHub runner.
          block, n = re.subn(
              r'my \$iosSdkVersion = "9\.3";',
              'my $iosSdkVersion = `xcrun --sdk iphoneos --show-sdk-version`; chomp($iosSdkVersion);',
              block,
              count=1
          )
          assert n == 1

          block, n = re.subn(
              r'my \$iphoneOsMinVersion = "3\.0";',
              'my $iphoneOsMinVersion = "12.0";',
              block,
              count=1
          )
          assert n == 1

          block, n = re.subn(
              r'my \$iosSdkRoot = .*?;',
              'my $iosSdkRoot = `xcrun --sdk iphoneos --show-sdk-path`; chomp($iosSdkRoot);',
              block,
              count=1
          )
          assert n == 1

          # Modern Xcode compiler paths.
          block, n = re.subn(
              r'\$ENV\{CC\} = .*?;',
              '$ENV{CC} = `xcrun --sdk iphoneos -f clang`; chomp($ENV{CC});',
              block,
              count=1
          )
          assert n == 1

          block, n = re.subn(
              r'\$ENV\{CXX\} = .*?;',
              '$ENV{CXX} = `xcrun --sdk iphoneos -f clang++`; chomp($ENV{CXX});',
              block,
              count=1
          )
          assert n == 1

          block, n = re.subn(
              r'\$ENV\{LD\} = .*?;',
              '$ENV{LD} = `xcrun --sdk iphoneos -f ld`; chomp($ENV{LD});',
              block,
              count=1
          )
          assert n == 1

          # The modern SDK doesn't have the old SDK/usr/include layout.
          block = re.sub(
              r'\$ENV\{C_INCLUDE_PATH\} = .*?;',
              'delete $ENV{C_INCLUDE_PATH};',
              block,
              count=1
          )

          block = re.sub(
              r'\$ENV\{CPLUS_INCLUDE_PATH\} = .*?;',
              'delete $ENV{CPLUS_INCLUDE_PATH};',
              block,
              count=1
          )

          # Replace the first CFLAGS assignment in the iPhone block.
          block, n = re.subn(
              r'\$ENV\{CFLAGS\} = .*?;',
              '$ENV{CFLAGS} = "$iosCFlagsCommon -g -DSMALL_CONFIG -DHAVE_LARGE_FILE_SUPPORT=1 -Wl,-application_extension -miphoneos-version-min=$iphoneOsMinVersion -Os -arch $iphoneArch -isysroot $iosSdkRoot -Wno-deprecated-declarations";',
              block,
              count=1
          )
          assert n == 1

          # Don't inject 32-bit ARM preprocessor definitions.
          block, n = re.subn(
              r'\$ENV\{CXXFLAGS\} = .*?;',
              '$ENV{CXXFLAGS} = "$ENV{CFLAGS} -U__powerpc__ -U__i386__";',
              block,
              count=1
          )
          assert n == 1

          # Preserve everything else in the Unity iPhone configuration.
          text = text[:start] + block + text[end:]

          # Modern Xcode doesn't support the old Unity bitcode setup.
          text, n = text.replace(
              'push @configureparams, "--with-bitcode=yes";',
              'push @configureparams, "--with-bitcode=no";',
              1
          ), 1

          path.write_text(text)

          print("=== Patched iPhone build configuration ===")
          print(block)
          
      - name: Patch iOS warning flags
        shell: python
        run: |
          from pathlib import Path

          path = Path("mono/utils/Makefile.am")
          text = path.read_text()

          old = "libmonoutils_la_CFLAGS = $(JEMALLOC_CFLAGS) @CXX_ADD_CFLAGS@"
          new = old + " -Wno-error=deprecated-declarations"

          if old not in text:
              raise SystemExit("Could not find libmonoutils_la_CFLAGS")

          path.write_text(text.replace(old, new, 1))
          
      - name: Verify patched iOS configuration
        run: |
          set -euxo pipefail

          grep -n -A65 -B5 \
            'if (\$iphone)' \
            external/buildscripts/build.pl | head -n 100

      - name: Build Mono
        shell: bash
        run: |
          set -euxo pipefail

          perl external/buildscripts/build.pl \
            --build=1 \
            --clean=1 \
            --iphonearch=arm64 \
            --disablemcs=1 \
            --debug=1 \
            --jobs=4 \
            --stevedorebuilddeps=0 \
            --builddeps="$GITHUB_WORKSPACE/local-build-deps"

      - name: Inspect built artifacts
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== builds directory ==="
          find builds -maxdepth 5 -type f -print 2>/dev/null || true

          echo "=== Mono libraries ==="
          find builds -type f \
            \( -name 'libmonosgen-2.0.a' \
            -o -name 'libmonosgen-2.0.dylib' \
            -o -name '*.a' \
            -o -name '*.dylib' \) \
            -print 2>/dev/null || true

      - name: Dump configure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo "================ config.log ================"
          tail -n 300 config.log 2>/dev/null || true

          echo "================ configure outputs ================"
          find . \
            \( -name config.log \
            -o -name config.status \
            -o -name config.cache \) \
            -print 2>/dev/null | head -n 100

          echo "================ Xcode ================"
          xcode-select -p
          xcodebuild -version

          echo "================ SDK ================"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos -f clang
          xcrun --sdk iphoneos -f clang++

      - name: Upload Mono build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-ios-arm64-jit
          path: |
            builds/**
          if-no-files-found: warn
