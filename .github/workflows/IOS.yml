name: Build Unity Mono iOS ARM64 JIT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          submodules: recursive
          fetch-depth: 1

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Prepare public build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"

          mkdir -p "$DEPS"
          mkdir -p "$DEPS/built-tools/bin"
          mkdir -p "$DEPS/iOSBuildEnvironment/builds"

          cd "$DEPS"

          curl -L https://ftp.gnu.org/gnu/autoconf/autoconf-2.69.tar.gz \
            -o autoconf.tar.gz
          mkdir -p autoconf-2-69
          tar -xzf autoconf.tar.gz -C autoconf-2-69

          curl -L https://ftp.gnu.org/gnu/automake/automake-1.16.1.tar.gz \
            -o automake.tar.gz
          mkdir -p automake-1-16-1
          tar -xzf automake.tar.gz -C automake-1-16-1

          curl -L https://ftpmirror.gnu.org/libtool/libtool-2.4.6.tar.gz \
            -o libtool.tar.gz
          mkdir -p libtool-2-4-6
          tar -xzf libtool.tar.gz -C libtool-2-4-6

      - name: Prepare Xcode compatibility layout
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"
          XCODE="$(xcode-select -p)"
          XCODE_APP="$(dirname "$(dirname "$XCODE")")"

          mkdir -p "$DEPS/iOSBuildEnvironment/builds"

          ln -sfn "$XCODE_APP" \
            "$DEPS/iOSBuildEnvironment/builds/Xcode.app"

          echo "Using Xcode:"
          readlink "$DEPS/iOSBuildEnvironment/builds/Xcode.app"

      - name: Build Mono
        run: |
          set -euxo pipefail

          perl external/buildscripts/build.pl \
          --build=1 \
          --clean=1 \
          --iphonearch=arm64 \
          --disablemcs=1 \
          --debug=1 \
          --stevedorebuilddeps=0 \
          --builddeps="$GITHUB_WORKSPACE/local-build-deps"

      - name: Inspect result
        run: |
          find builds -type f \
            \( -name 'libmonosgen-2.0.a' \
            -o -name 'libmonobdwgc-2.0.a' \
            -o -name '*.dylib' \
            -o -name '*.a' \) \
            -print

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-ios-arm64-jit
          path: builds/**
