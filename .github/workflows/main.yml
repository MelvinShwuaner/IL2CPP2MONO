name: Build Unity Mono iOS ARM64 JIT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mono
        uses: actions/checkout@v4
        with:
          ref: unity-2022.3-mbe
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config gettext \
            cmake ninja

      - name: Patch iOS build to retain JIT
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("external/buildscripts/build.pl")
          text = path.read_text()

          old = "--enable-minimal=$iosMinimalCommon,ssa,jit,reflection_emit_save"
          new = "--enable-minimal=$iosMinimalCommon,ssa,reflection_emit_save"

          if old not in text:
              raise SystemExit("Could not find expected iOS minimal configuration")

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Build iOS ARM64 Mono
        run: |
          perl external/buildscripts/build.pl \
            --build=1 \
            --iphonearch=arm64 \
            --debug=1 \
            --disablemcs=1 \
            --stevedorebuilddeps=1

      - name: Inspect output
        run: |
          find builds -type f \
            \( -name "*.dylib" -o -name "*.a" -o -name "*.dSYM" \) \
            -print

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-ios-arm64-jit
          path: |
            builds/**
