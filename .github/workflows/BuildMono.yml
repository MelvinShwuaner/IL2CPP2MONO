name: Build Unity Mono Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            flex \
            gettext \
            libtool \
            mono-complete \
            ninja-build \
            perl \
            pkg-config \
            p7zip-full \
            python3 \
            rsync \
            unzip \
            wget

      - name: Show tool versions
        run: |
          gcc --version
          clang --version || true
          mono --version
          python3 --version
          make --version
          autoconf --version | head -n 1
          automake --version | head -n 1

      - name: Enable Boehm GC for Android
        shell: bash
        run: |
          set -e

          echo "===== Original Android GC configuration ====="
          grep -n -E 'disable-boehm|enable-boehm|with-sgen' \
            sdks/builds/android.mk || true

          echo
          echo "===== Patching Android build ====="

          python3 - <<'PY'
          from pathlib import Path

          path = Path("sdks/builds/android.mk")
          text = path.read_text()

          old = "\t--disable-boehm \\\n"
          new = "\t--enable-boehm \\\n"

          count = text.count(old)

          if count == 0:
              raise SystemExit(
                  "Could not find --disable-boehm in sdks/builds/android.mk"
              )

          text = text.replace(old, new)

          path.write_text(text)
          print(f"Replaced {count} occurrence(s) of --disable-boehm")
          PY

          echo
          echo "===== Patched Android GC configuration ====="
          grep -n -E 'disable-boehm|enable-boehm|with-sgen' \
            sdks/builds/android.mk || true

      - name: Inspect GC/build configuration
        shell: bash
        run: |
          echo "===== Build variables mentioning GC/SGen/Boehm ====="

          grep -RniE \
            'sgen|boehm|garbage.?collector|ENABLE_.*GC|USE_.*GC|SUPPORT_BOEHM|SUPPORT_SGEN' \
            sdks/builds \
            configure.ac \
            Makefile* \
            2>/dev/null || true

          echo
          echo "===== Android configure flags ====="

          grep -n -A20 -B2 \
            '_android-.*_CONFIGURE_FLAGS' \
            sdks/builds/android.mk \
            2>/dev/null || true

      - name: Build Unity Mono ARM64 Android
        shell: bash
        run: |
          set -o pipefail

          make -C sdks/builds \
            ENABLE_ANDROID=1 \
            CONFIGURATION=release \
            -j1 \
            package-android-arm64-v8a \
            2>&1 | tee "$GITHUB_WORKSPACE/mono-build.log"

      - name: Inspect generated libraries
        if: always()
        shell: bash
        run: |
          echo "===== Shared libraries containing Mono ====="

          find sdks -type f -name '*.so' \
            -print | sort

          echo
          echo "===== Libraries with GC/liveness symbols ====="

          while IFS= read -r lib; do
            echo
            echo "----- $lib -----"

            nm -D "$lib" 2>/dev/null | \
              grep -E \
                'mono_(unity_)?liveness|mono_gc|sgen|boehm' \
              || true
          done < <(
            find sdks -type f -name '*.so' -print | sort
          )

      - name: Verify Boehm liveness symbols
        if: always()
        shell: bash
        run: |
          echo "===== Searching for mono_unity_liveness_* ====="

          found=0

          while IFS= read -r lib; do
            matches="$(
              nm -D "$lib" 2>/dev/null |
              grep 'mono_unity_liveness_' || true
            )"

            if [ -n "$matches" ]; then
              echo
              echo "----- $lib -----"
              echo "$matches"
              found=1
            fi
          done < <(
            find sdks -type f -name '*.so' -print | sort
          )

          if [ "$found" -eq 0 ]; then
            echo
            echo "WARNING: No exported mono_unity_liveness_* symbols found."
          fi

      - name: Show actual build errors
        if: always()
        shell: bash
        run: |
          echo "===== compiler/build errors ====="

          grep -nEi \
            'error CS[0-9]+|error [A-Z]+[0-9]+|fatal error|Unhandled Exception|Unhandled exception|Exception:|command not found|No such file|failed' \
            mono-build.log \
            || true

          echo
          echo "===== last 300 lines ====="
          tail -n 300 mono-build.log

      - name: Show generated artifacts
        if: success()
        shell: bash
        run: |
          echo "===== ARM64 artifacts ====="

          find sdks -type f \
            \( \
              -name '*.so' \
              -o -name '*.dll' \
              -o -name '*.zip' \
              -o -name '*.tar.gz' \
            \) \
            -print \
            | sort

      - name: Upload ARM64 Mono build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-2022.3-android-arm64-boehm
          path: |
            sdks/out/**
            sdks/builds/out/**
          if-no-files-found: warn
          compression-level: 6

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-build-log
          path: mono-build.log
          if-no-files-found: error
          compression-level: 6
