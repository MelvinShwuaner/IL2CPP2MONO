name: Build Unity Mono iOS ARM64 JIT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-7

    steps:
      # ------------------------------------------------------------
      # Checkout Unity's Mono fork
      # ------------------------------------------------------------
      - name: Checkout Unity Mono
        uses: actions/checkout@v4
        with:
          repository: Unity-Technologies/mono
          ref: unity-2022.3-mbe
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------
      # Select the Xcode version available on the hosted runner
      # ------------------------------------------------------------
      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail

          test -d /Applications/Xcode_15.4.app

          sudo xcode-select -s \
            /Applications/Xcode_15.4.app/Contents/Developer

          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo
          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos -f clang
          xcrun --sdk iphoneos -f clang++
          xcrun --sdk iphoneos -f ld

      # ------------------------------------------------------------
      # Prepare the public build dependencies expected by build.pl.
      #
      # build.pl expects:
      #
      #   autoconf-2-69/autoconf-2.69
      #   automake-1-16-1/automake-1.16.1
      #   libtool-2-4-6/libtool-2.4.6
      #   built-tools/
      #   iOSBuildEnvironment/
      #
      # Using --stevedorebuilddeps=0 prevents access to Unity's
      # internal Stevedore server.
      # ------------------------------------------------------------
      - name: Prepare local Mono build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"

          mkdir -p "$DEPS/autoconf-2-69"
          mkdir -p "$DEPS/automake-1-16-1"
          mkdir -p "$DEPS/libtool-2-4-6"
          mkdir -p "$DEPS/iOSBuildEnvironment/builds"
          mkdir -p "$DEPS/built-tools/bin"

          echo "Downloading autoconf..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/autoconf/autoconf-2.69.tar.gz \
            -o "$DEPS/autoconf-2-69/autoconf-2.69.tar.gz"

          echo "Downloading automake..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/automake/automake-1.16.1.tar.gz \
            -o "$DEPS/automake-1-16-1/automake-1.16.1.tar.gz"

          echo "Downloading libtool..."
          curl -fL --retry 5 --retry-delay 2 \
            https://ftp.gnu.org/gnu/libtool/libtool-2.4.6.tar.gz \
            -o "$DEPS/libtool-2-4-6/libtool-2.4.6.tar.gz"

      # ------------------------------------------------------------
      # build.pl expects an Xcode.app at this path.
      #
      # We don't have Unity's historical Xcode bundle, so point the
      # expected path at the hosted runner's Xcode.
      # ------------------------------------------------------------
      - name: Provide Xcode compatibility layout
        shell: bash
        run: |
          set -euxo pipefail

          DEPS="$GITHUB_WORKSPACE/local-build-deps"
          XCODE_APP="/Applications/Xcode_15.4.app"

          ln -sfn \
            "$XCODE_APP" \
            "$DEPS/iOSBuildEnvironment/builds/Xcode.app"

          test -x \
            "$DEPS/iOSBuildEnvironment/builds/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"

      # ------------------------------------------------------------
      # Patch the old Unity iOS build configuration so it works with
      # a modern Xcode and actually configures Mono as ARM64.
      # ------------------------------------------------------------
      - name: Patch Unity iOS build configuration
        shell: python
        run: |
          from pathlib import Path

          path = Path("external/buildscripts/build.pl")
          text = path.read_text()

          replacements = {
              # ----------------------------------------------------
              # Use the Xcode/iOS SDK installed on the runner.
              # ----------------------------------------------------
              'my $iosSdkVersion = "9.3";':
                  'my $iosSdkVersion = `xcrun --sdk iphoneos --show-sdk-version`; chomp($iosSdkVersion);',

              'my $iphoneOsMinVersion = "3.0";':
                  'my $iphoneOsMinVersion = "12.0";',

              'my $iosSdkRoot = "$iosBuildEnvDir/builds/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS$iosSdkVersion.sdk";':
                  'my $iosSdkRoot = `xcrun --sdk iphoneos --show-sdk-path`; chomp($iosSdkRoot);',

              # ----------------------------------------------------
              # Use modern Xcode compiler locations.
              # ----------------------------------------------------
              '$ENV{CC} = "$iosBuildEnvDir/builds/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang -arch $iphoneArch";':
                  '$ENV{CC} = `xcrun --sdk iphoneos -f clang`; chomp($ENV{CC});',

              '$ENV{CXX} = "$iosBuildEnvDir/builds/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang++ -arch $iphoneArch";':
                  '$ENV{CXX} = `xcrun --sdk iphoneos -f clang++`; chomp($ENV{CXX});',

              '$ENV{LD} = "$iosBuildEnvDir/builds/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/ld";':
                  '$ENV{LD} = `xcrun --sdk iphoneos -f ld`; chomp($ENV{LD});',

              # ----------------------------------------------------
              # The modern SDK has no SDK/usr/include directory.
              # ----------------------------------------------------
              '$ENV{C_INCLUDE_PATH} = "$iosSdkRoot/usr/include";':
                  'delete $ENV{C_INCLUDE_PATH};',

              '$ENV{CPLUS_INCLUDE_PATH} = "$iosSdkRoot/usr/include";':
                  'delete $ENV{CPLUS_INCLUDE_PATH};',

              # ----------------------------------------------------
              # Remove obsolete 32-bit ARM flags and explicitly
              # compile as arm64.
              # ----------------------------------------------------
              '$ENV{CFLAGS} = "$iosCFlagsCommon -gdwarf-2 -DSMALL_CONFIG -DHAVE_LARGE_FILE_SUPPORT=1 -DHAVE_ARMV6=1 -DARM_FPU_VFP=1 -Wl,-application_extension -miphoneos-version-min=$iphoneOsMinVersion -mno-thumb -Os -isysroot $iosSdkRoot";':
                  '$ENV{CFLAGS} = "$iosCFlagsCommon -g -DSMALL_CONFIG -DHAVE_LARGE_FILE_SUPPORT=1 -Wl,-application_extension -miphoneos-version-min=$iphoneOsMinVersion -Os -arch $iphoneArch -isysroot $iosSdkRoot";',

              # ----------------------------------------------------
              # Don't define 32-bit __arm__ for an AArch64 build.
              # ----------------------------------------------------
              '$ENV{CXXFLAGS} = "$ENV{CFLAGS} -U__powerpc__ -U__i386__ -D__arm__";':
                  '$ENV{CXXFLAGS} = "$ENV{CFLAGS} -U__powerpc__ -U__i386__";',

              # ----------------------------------------------------
              # THIS IS THE IMPORTANT ARCH FIX.
              #
              # Unity's script currently says:
              #
              #   arm-apple-darwin10
              #
              # which makes configure select TARGET_ARM.
              #
              # Use an AArch64 host triple instead.
              # ----------------------------------------------------
              'push @configureparams, "--host=arm-apple-darwin$darwinVersion";':
                  'push @configureparams, "--host=aarch64-apple-darwin$darwinVersion";',

              # ----------------------------------------------------
              # Old Unity builds request bitcode. Current Xcode does
              # not need this for our runtime build.
              # ----------------------------------------------------
              'push @configureparams, "--with-bitcode=yes";':
                  'push @configureparams, "--with-bitcode=no";',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      "Expected line was not found in build.pl:\n" + old
                  )

              text = text.replace(old, new, 1)

          path.write_text(text)

          print("build.pl patched successfully.")

      # ------------------------------------------------------------
      # Unity's HOST_IOS logger uses deprecated ASL:
      #
      #   #include <asl.h>
      #   asl_log(...)
      #
      # The same source file already contains an os_log()
      # implementation used by HOST_MACCAT / newer Apple targets.
      #
      # Make HOST_IOS use that existing implementation.
      # ------------------------------------------------------------
      - name: Patch Darwin iOS logging
        shell: python
        run: |
          from pathlib import Path

          path = Path("mono/utils/mono-log-darwin.c")
          text = path.read_text()

          old_condition = (
              "#if (defined(HOST_WATCHOS) && "
              "(__WATCH_OS_VERSION_MIN_REQUIRED >= __WATCHOS_3_0)) "
              "|| defined(HOST_MACCAT)"
          )

          new_condition = (
              "#if (defined(HOST_WATCHOS) && "
              "(__WATCH_OS_VERSION_MIN_REQUIRED >= __WATCHOS_3_0)) "
              "|| defined(HOST_MACCAT) || defined(HOST_IOS)"
          )

          if old_condition not in text:
              raise SystemExit(
                  "Could not find the expected Darwin os_log condition."
              )

          text = text.replace(old_condition, new_condition, 1)

          # The old ASL implementation must no longer be selected.
          old_ios_branch = "#elif defined(HOST_IOS)"
          new_ios_branch = "#elif defined(HOST_IOS) && 0"

          if old_ios_branch not in text:
              raise SystemExit(
                  "Could not find the HOST_IOS ASL branch."
              )

          text = text.replace(old_ios_branch, new_ios_branch, 1)

          path.write_text(text)

          print("HOST_IOS now uses the existing os_log implementation.")

      - name: Patch Objective-C super structure
        shell: python
        run: |
          from pathlib import Path

          path = Path("mono/utils/mono-threads-mach-helper.c")
          text = path.read_text()

          old = """\tsuper.receiver = self;
          #if !defined(__cplusplus) && !__OBJC2__
          \tsuper.class = nsobject;
          #else
          \tsuper.super_class = nsobject;
          #endif"""

          new = """\tsuper.receiver = self;
          \tsuper.super_class = nsobject;"""

          if old not in text:
              raise SystemExit(
                  "Expected objc_super initialization was not found"
              )

          path.write_text(text.replace(old, new, 1))

          print("Patched objc_super for modern Apple headers.")    

      # ------------------------------------------------------------
      # Verify exactly what we're about to build.
      # ------------------------------------------------------------
      - name: Verify configuration patches
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "JIT configuration"
          echo "========================================"

          grep -n \
            'enable-minimal=.*ssa,jit' \
            external/buildscripts/build.pl

          echo
          echo "========================================"
          echo "iOS host triple"
          echo "========================================"

          grep -n \
            'host=.*apple-darwin' \
            external/buildscripts/build.pl

          echo
          echo "========================================"
          echo "iOS SDK/compiler configuration"
          echo "========================================"

          grep -n \
            'iosSdkVersion\|iphoneOsMinVersion\|show-sdk-path\|ENV{CC}\|ENV{CXX}' \
            external/buildscripts/build.pl

          echo
          echo "========================================"
          echo "Obsolete ARM flags"
          echo "========================================"

          grep -n \
            'HAVE_ARMV6\|ARM_FPU_VFP\|mno-thumb\|-D__arm__' \
            external/buildscripts/build.pl || true

          echo
          echo "========================================"
          echo "Darwin logger"
          echo "========================================"

          grep -n \
            'HOST_IOS\|HOST_MACCAT\|os/log.h\|asl.h\|asl_log' \
            mono/utils/mono-log-darwin.c

      # ------------------------------------------------------------
      # Build.
      #
      # --clean=1 is important because build.pl otherwise assumes
      # configure/Makefiles already exist.
      # ------------------------------------------------------------
      - name: Build Mono
        shell: bash
        run: |
          set -euxo pipefail

          perl external/buildscripts/build.pl \
            --build=1 \
            --clean=1 \
            --iphonearch=arm64 \
            --disablemcs=1 \
            --debug=1 \
            --jobs=4 \
            --stevedorebuilddeps=0 \
            --builddeps="$GITHUB_WORKSPACE/local-build-deps"

      # ------------------------------------------------------------
      # Show what was produced.
      # ------------------------------------------------------------
      - name: Inspect build artifacts
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Build tree"
          echo "========================================"

          find builds -type f -print 2>/dev/null || true

          echo
          echo "========================================"
          echo "Libraries"
          echo "========================================"

          find builds -type f \
            \( \
              -name '*.a' \
              -o -name '*.dylib' \
              -o -name '*.dSYM' \
            \) \
            -print 2>/dev/null || true

      # ------------------------------------------------------------
      # If configuration/build fails, leave useful diagnostics in the
      # Actions log.
      # ------------------------------------------------------------
      - name: Dump diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Xcode"
          echo "========================================"

          xcode-select -p
          xcodebuild -version

          echo
          echo "========================================"
          echo "iOS SDK"
          echo "========================================"

          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "========================================"
          echo "config.log"
          echo "========================================"

          find . -name config.log -print 2>/dev/null

          for f in $(find . -name config.log -print 2>/dev/null); do
            echo
            echo "========== $f =========="
            tail -n 300 "$f"
          done

          echo
          echo "========================================"
          echo "Darwin logger"
          echo "========================================"

          sed -n '1,115p' mono/utils/mono-log-darwin.c

          echo
          echo "========================================"
          echo "Relevant build.pl"
          echo "========================================"

          grep -n -A70 -B10 \
            'if (\$iphone)' \
            external/buildscripts/build.pl || true

      # ------------------------------------------------------------
      # Upload whatever build output exists.
      # ------------------------------------------------------------
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-mono-ios-arm64-jit
          path: |
            builds/**
          if-no-files-found: warn
